<a routerLink="/task/add">+ ADD TASK</a>

<hr />

<div *ngIf="tasks.length === 0">No Tasks Available</div>

<div class="tasks">
  <div *ngFor="let task of tasks" class="card">
    <h3>{{ task.title }}</h3>
    <p>{{ task.description }}</p>
    <p>Status: {{ task.status }}</p>

    <button [routerLink]="['/task/edit', task.id]">EDIT</button>
    <button (click)="deleteTask(task.id)">DELETE</button>
  </div>
</div>
